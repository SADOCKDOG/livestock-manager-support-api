name = "livestock-manager-support-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Explicito aunque sea el valor por defecto de wrangler. Sin esta linea, anadir
# un bloque de rutas haria que wrangler INFIRIERA workers_dev = false en el
# siguiente despliegue, y el frontend de escritorio (y el de Android) hablan con
# este Worker por esa URL. Es heredable, asi que [env.production] la recibe.
workers_dev = true

# Variables publicas. Los SECRETOS nunca van aqui: se cargan con
# `wrangler secret put <NOMBRE> --env production`. Una var vacia del mismo
# nombre pisaria al secreto (fue la causa del incidente del 2026-08-28).
[vars]
GITHUB_REPO_OWNER = "SADOCKDOG"
GITHUB_REPO_NAME = "livestock-manager-support-tickets"
MAX_TICKETS_PER_DAY = "5"
MAX_MENSAJES_PER_DAY = "10"

# Workers AI: inferencia dentro de Cloudflare, sin clave ni saldo.
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "TICKETS_KV"
id = "4fd0fd1738244c4799628b32b9ce1487"

# Produccion. Wrangler no hereda vars ni bindings por entorno: se repiten.
[env.production.vars]
GITHUB_REPO_OWNER = "SADOCKDOG"
GITHUB_REPO_NAME = "livestock-manager-support-tickets"
MAX_TICKETS_PER_DAY = "5"
MAX_MENSAJES_PER_DAY = "10"

# Workers AI tambien aqui: los bindings no se heredan por entorno.
[env.production.ai]
binding = "AI"

[[env.production.kv_namespaces]]
binding = "TICKETS_KV"
id = "4fd0fd1738244c4799628b32b9ce1487"

# Observabilidad. Activada desde el panel el 2026-08-29 y reflejada aqui porque
# un `wrangler deploy` sin este bloque la volveria a apagar, y sin logs los
# fallos del backend solo se ven teniendo un `wrangler tail` abierto justo en el
# momento. Wrangler no hereda esta clave por entorno: se repite.
#
# `observability.enabled = false` con `logs.enabled = true` es lo que muestra el
# panel: la clave de arriba es la del sistema antiguo y la que manda ahora es la
# de `logs`. Se copia tal cual para que el fichero y el panel digan lo mismo.
[observability]
enabled = false
head_sampling_rate = 1
# `redact_query_string` existe en el panel pero no en el esquema de
# wrangler.toml, que avisa de campo inesperado. Se omite: su valor es
# `false`, que ya es el de por defecto, asi que no se pierde nada.

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[env.production.observability]
enabled = false
head_sampling_rate = 1
# `redact_query_string` existe en el panel pero no en el esquema de
# wrangler.toml, que avisa de campo inesperado. Se omite: su valor es
# `false`, que ya es el de por defecto, asi que no se pierde nada.

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[env.production.observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
