name = "livestock-manager-support-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Variables publicas. Los SECRETOS nunca van aqui: se cargan con
# `wrangler secret put <NOMBRE> --env production`. Una var vacia del mismo
# nombre pisaria al secreto (fue la causa del incidente del 2026-08-28).
[vars]
GITHUB_REPO_OWNER = "SADOCKDOG"
GITHUB_REPO_NAME = "livestock-manager-support-tickets"
MAX_TICKETS_PER_DAY = "5"

[[kv_namespaces]]
binding = "TICKETS_KV"
id = "4fd0fd1738244c4799628b32b9ce1487"

# Produccion. Wrangler no hereda vars ni bindings por entorno: se repiten.
[env.production.vars]
GITHUB_REPO_OWNER = "SADOCKDOG"
GITHUB_REPO_NAME = "livestock-manager-support-tickets"
MAX_TICKETS_PER_DAY = "5"

[[env.production.kv_namespaces]]
binding = "TICKETS_KV"
id = "4fd0fd1738244c4799628b32b9ce1487"

# Logs del Worker. Activado desde el panel el 2026-08-29; se refleja aqui
# porque un `wrangler deploy` sin este bloque volveria a apagarlos, y sin logs
# los fallos del backend solo se ven teniendo un `wrangler tail` abierto justo
# en el momento. Wrangler no hereda esta clave por entorno: se repite.
[observability.logs]
enabled = true
invocation_logs = true

[env.production.observability.logs]
enabled = true
invocation_logs = true
